name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Run unit tests BEFORE training ──────────────────────────────────────
      # The ML endpoint returns 503 when model.pkl is absent, which is expected.
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      # ── Train model and generate evaluation artifacts ────────────────────────
      - name: Train model
        run: python scripts/train.py

      # ── Build Docker image ───────────────────────────────────────────────────
      - name: Build Docker image
        run: docker build -t churn-ml:latest .

      # ── Upload model + all evaluation artifacts ──────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            model.pkl
            artifacts/metrics.txt
            artifacts/roc_curve.png
            artifacts/pr_curve.png
            artifacts/feature_importance.png
