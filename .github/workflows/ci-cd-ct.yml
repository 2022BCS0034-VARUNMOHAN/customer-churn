# .github/workflows/ci-cd-ct.yml
#
# CI/CD/CT Pipeline — what does each letter mean?
# ─────────────────────────────────────────────────
# CI = Continuous Integration
#      Every time code is pushed, automatically:
#        → Install dependencies
#        → Run tests
#        → Check code quality
#
# CD = Continuous Deployment
#      After CI passes on main branch:
#        → Build Docker image
#        → Push to registry
#        → Deploy to server
#
# CT = Continuous Training
#      On a schedule (every Sunday night):
#        → Check for data drift
#        → If drift found → retrain model
#        → Log new model to MLflow
#        → Run tests again
#
# This file lives in .github/workflows/ and GitHub reads it automatically.

name: CI / CD / CT Pipeline

on:
  # Trigger on every push to any branch
  push:
    branches: ["**"]

  # Trigger on pull requests to main
  pull_request:
    branches: [main]

  # CT: Run every Sunday at 2am UTC
  # Cron format: minute hour day-of-month month day-of-week
  schedule:
    - cron: "0 2 * * 0" # every Sunday at 02:00 UTC

  # Allow manually triggering from GitHub UI
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Force model retraining?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# ══════════════════════════════════════════════════════════════════════════════
jobs:
  # ══════════════════════════════════════════════════════════════════════════════

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: CI — Continuous Integration
  # Runs on EVERY push. Checks that the code is correct and tests pass.
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: "CI — Test & Lint"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the code from GitHub onto the runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip # cache pip packages → faster runs

      # Step 3: Install all project dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Prepare data (needed for training + tests)
      - name: Prepare data
        run: python scripts/prepare_data.py

      # Step 5: Train model (needed for inference tests)
      - name: Train model
        run: python scripts/train.py

      # Step 6: Run all tests
      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Step 7: Save test artifacts (uploaded to GitHub so you can download them)
      - name: Upload artifacts
        if: always() # upload even if tests fail (so you can debug)
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            artifacts/
            artifacts/monitoring/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: CD — Continuous Deployment
  # Only runs when CI passes AND we're on the main branch.
  # Builds and pushes Docker image.
  # ────────────────────────────────────────────────────────────────────────────
  cd:
    name: "CD — Build & Push Docker"
    runs-on: ubuntu-latest
    needs: ci # only run if CI job passed
    if: github.ref == 'refs/heads/main' # only on main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies & train model
        run: |
          pip install -r requirements.txt
          python scripts/prepare_data.py
          python scripts/train.py

      # Build the Docker image
      # The image is tagged with the Git commit SHA so we know exactly which
      # code version each image corresponds to
      - name: Build Docker image
        run: |
          docker build -t customer-churn:${{ github.sha }} .
          docker tag customer-churn:${{ github.sha }} customer-churn:latest

      # NOTE: To push to Docker Hub or AWS ECR, uncomment and configure:
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Push image
      #   run: docker push customer-churn:latest

      - name: Verify Docker image runs
        run: |
          docker run --rm -d \
            --name churn-test \
            -p 8000:8000 \
            customer-churn:latest
          sleep 5
          curl -f http://localhost:8000/health || (docker logs churn-test && exit 1)
          docker stop churn-test

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: CT — Continuous Training
  # Runs on a weekly schedule. Checks for drift and retrains if needed.
  # ────────────────────────────────────────────────────────────────────────────
  ct:
    name: "CT — Continuous Training"
    runs-on: ubuntu-latest
    # Run on schedule OR when manually triggered
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data
        run: python scripts/prepare_data.py

      # Run the retrain script.
      # If force_retrain input = "true", pass --force flag
      - name: Check drift and retrain if needed
        run: |
          if [ "${{ github.event.inputs.force_retrain }}" = "true" ]; then
            echo "Force retraining requested"
            python scripts/retrain.py --force
          else
            echo "Running drift check + conditional retraining"
            python scripts/retrain.py
          fi

      # Run tests to confirm new model works
      - name: Run tests after retraining
        run: pytest tests/ -v --tb=short

      # Save the new model and monitoring report
      - name: Upload new model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model-${{ github.run_number }}
          path: |
            model.pkl
            artifacts/
            mlruns/
