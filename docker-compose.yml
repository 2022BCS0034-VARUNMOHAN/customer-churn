version: "3.9"

services:
  churn-api:
    build: .
    image: churn-ml:latest
    container_name: churn-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
    volumes:
      # Mount model artifact so it persists outside the container
      - ./model.pkl:/app/model.pkl:ro
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional: Prometheus scrapes /metrics on the API
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - churn-api
    restart: unless-stopped
